name: Promo Video

# 宣传视频：模拟器截取真实界面 → Remotion 渲染 1080×1920 / 60s MP4
on:
  workflow_dispatch:
  push:
    paths:
      - 'promo/**'
      - '.github/workflows/promo-video.yml'

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v3

      - name: 修正 Gradle 下载源
        run: |
          sed -i 's|https\\://mirrors.tencent.com/gradle/gradle-.*-bin.zip|https\\://services.gradle.org/distributions/gradle-8.11.1-bin.zip|' gradle/wrapper/gradle-wrapper.properties
          rm -f local.properties

      - name: 恢复签名密钥
        env:
          FOCUSGUARD_KEYSTORE_BASE64: ${{ secrets.FOCUSGUARD_KEYSTORE_BASE64 }}
          FOCUSGUARD_STORE_PASSWORD: ${{ secrets.FOCUSGUARD_STORE_PASSWORD }}
          FOCUSGUARD_KEY_ALIAS: ${{ secrets.FOCUSGUARD_KEY_ALIAS }}
          FOCUSGUARD_KEY_PASSWORD: ${{ secrets.FOCUSGUARD_KEY_PASSWORD }}
        run: |
          test -n "$FOCUSGUARD_KEYSTORE_BASE64"
          mkdir -p keystore
          printf '%s' "$FOCUSGUARD_KEYSTORE_BASE64" | base64 --decode > keystore/focusguard-release.p12
          chmod 600 keystore/focusguard-release.p12
          printf 'FOCUSGUARD_STORE_PASSWORD=%s\n' "$FOCUSGUARD_STORE_PASSWORD" >> "$GITHUB_ENV"
          printf 'FOCUSGUARD_KEY_ALIAS=%s\n' "$FOCUSGUARD_KEY_ALIAS" >> "$GITHUB_ENV"
          printf 'FOCUSGUARD_KEY_PASSWORD=%s\n' "$FOCUSGUARD_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: 构建 Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: 启用 KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: 模拟器截图
        uses: reactivecircus/android-emulator-runner@v2
        continue-on-error: true
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash promo/scripts/capture.sh app/build/outputs/apk/debug/app-debug.apk promo-shots

      - name: 上传截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: promo-screenshots
          path: promo-shots/
          if-no-files-found: warn
          retention-days: 30

  render:
    needs: screenshots
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载截图
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: promo-screenshots
          path: promo-shots

      - name: 安装字体与 ffmpeg
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg fonts-noto-cjk fonts-noto-color-emoji
          fc-cache -f
          python3 -m pip install --quiet numpy==2.1.3

      - name: 安装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖
        working-directory: promo
        run: npm install --no-audit --no-fund

      - name: 准备素材与节拍
        run: python3 promo/scripts/prepare.py promo-shots

      - name: 类型检查
        working-directory: promo
        run: npx tsc --noEmit

      - name: 渲染视频
        working-directory: promo
        run: npm run render

      - name: 校验与预览图
        working-directory: promo
        run: |
          ffprobe -v error -show_entries format=duration:stream=codec_type,width,height,r_frame_rate -of default=nw=1 out/promo.mp4 | tee out/probe.txt
          dur=$(ffprobe -v error -show_entries format=duration -of csv=p=0 out/promo.mp4)
          python3 -c "import sys; d=float('$dur'); sys.exit(0 if abs(d-60)<=0.15 else 1)" || { echo "时长异常: $dur"; exit 1; }
          grep -q "width=1080" out/probe.txt && grep -q "height=1920" out/probe.txt
          # 每 6 秒抽一帧拼成 5×2 预览图
          ffmpeg -v error -y -i out/promo.mp4 -vf "fps=1/6,scale=324:576,tile=5x2" -frames:v 1 out/contact.png
          # 真实截图总览（检查有无系统提示等多余元素）
          if ls ../promo-shots/*.png >/dev/null 2>&1; then
            ffmpeg -v error -y -pattern_type glob -i '../promo-shots/*.png' -vf "scale=270:600,tile=7x2" -frames:v 1 out/shots-sheet.png || true
          fi
          ls -la out

      - name: 上传视频
        uses: actions/upload-artifact@v4
        with:
          name: focusguard-promo-mp4
          path: |
            promo/out/promo.mp4
            promo/out/contact.png
            promo/out/shots-sheet.png
            promo/out/probe.txt
          retention-days: 30
