name: Build APK

# 触发条件：
# 1. 推送到 main 分支
# 2. 手动触发（Actions 页面点 "Run workflow"）
# 发布 Release 需要写权限（GitHub 默认令牌权限已收紧为只读，必须显式声明）
permissions:
  contents: write

on:
  push:
    branches: [main, 'fix/**', 'feat/**']
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v3

      # 本机生成的 gradle-wrapper.properties 指向腾讯镜像（国内快），
      # 但 GitHub 服务器在海外，官方源更稳，这里换回去（版本号用通配，升级 wrapper 无需改这里）
      - name: 修正 Gradle 下载源
        run: |
          sed -i 's|https\\://mirrors.tencent.com/gradle/gradle-.*-bin.zip|https\\://services.gradle.org/distributions/gradle-8.11.1-bin.zip|' gradle/wrapper/gradle-wrapper.properties
          grep distributionUrl gradle/wrapper/gradle-wrapper.properties

      # local.properties 里的 sdk.dir 是开发机路径，CI 环境不需要它
      #（ANDROID_HOME 由 AGP 自动探测），直接移除避免干扰
      - name: 清理本机路径配置
        run: rm -f local.properties

      # 稳定签名密钥只保存在 GitHub Actions Secrets，不进入公开仓库。
      # 所有构建使用同一证书，支持后续 APK 覆盖安装升级。
      - name: 恢复稳定签名密钥
        env:
          FOCUSGUARD_KEYSTORE_BASE64: ${{ secrets.FOCUSGUARD_KEYSTORE_BASE64 }}
          FOCUSGUARD_STORE_PASSWORD: ${{ secrets.FOCUSGUARD_STORE_PASSWORD }}
          FOCUSGUARD_KEY_ALIAS: ${{ secrets.FOCUSGUARD_KEY_ALIAS }}
          FOCUSGUARD_KEY_PASSWORD: ${{ secrets.FOCUSGUARD_KEY_PASSWORD }}
        run: |
          test -n "$FOCUSGUARD_KEYSTORE_BASE64"
          mkdir -p keystore
          printf '%s' "$FOCUSGUARD_KEYSTORE_BASE64" | base64 --decode > keystore/focusguard-release.p12
          chmod 600 keystore/focusguard-release.p12
          printf 'FOCUSGUARD_STORE_PASSWORD=%s\n' "$FOCUSGUARD_STORE_PASSWORD" >> "$GITHUB_ENV"
          printf 'FOCUSGUARD_KEY_ALIAS=%s\n' "$FOCUSGUARD_KEY_ALIAS" >> "$GITHUB_ENV"
          printf 'FOCUSGUARD_KEY_PASSWORD=%s\n' "$FOCUSGUARD_KEY_PASSWORD" >> "$GITHUB_ENV"

      # 拆分 flavor 后 testDebugUnitTest 有歧义，需明确指定两个变体
      - name: 单元测试
        run: ./gradlew testEduDebugUnitTest testGeneralDebugUnitTest --no-daemon

      - name: 上传测试报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          retention-days: 7

      # 发布与测试通道都用 release 变体：
      # debug 包 debuggable=true、未压缩混淆，不能作为对外分发的安装包。
      - name: 构建 Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: 上传 APK 产物（学段版 / 通用版）
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apks
          path: |
            app/build/outputs/apk/edu/release/*.apk
            app/build/outputs/apk/general/release/*.apk
          if-no-files-found: error
          retention-days: 30

      # 仅在 main 分支推送且打标签时自动创建 / 更新 GitHub Release
      - name: 发布 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/edu/release/*.apk
            app/build/outputs/apk/general/release/*.apk
          name: ${{ github.ref_name }} - 正式版
          # 更新说明手写、说人话（不用提交信息自动生成，太技术化）
          body: |
            新增了截屏识别：开=无障碍截图，关=共享屏幕
            新增了守护自愈：权限被撤、后台被拦都会明确提示
            新增了闹钟授权：Android 12+ 可一键开启，被杀后秒级恢复
            优化了识别：切前台等 5.5 秒再判，日志里能看到耗时拆分
            优化了速度：去掉每轮多余的前台查询
            优化了日志：AI 判定附带「取图/网络」耗时
            优化了兼容：Android 11–16 的前台服务与投影流程适配
            修复了闪退：检测更新、导出诊断日志不再退出应用
            修复了漏检：同一应用停留较久后不再停止识别
            修复了通知：开守护后通知栏正文不再被隐藏
            修复了投屏：Android 14 不再只能选单个应用
            修复了更新：测试版通道改为按版本号判断
            修复了卡顿：超长日志与超大响应限量处理
            修复了错判：前台应用改按事件流判定，不再误判

            ────────────────
            【两个版本的区别】功能完全一样，只有答题内容不同：
            · 学段版 app-edu-release.apk：内置题库，按年级+学科出题（高中按选科筛选），含选择/多选/填空 —— 学生自用；
            · 通用版 app-general-release.apk：不含题库，出繁复的高强度计算题 —— 通用场景。
            包名不同（com.focusguard.app / com.focusguard.app.general），两个可以同时安装；同一签名可覆盖安装升级。
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 读取版本号（供测试版通道比较新旧）
        id: ver
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          V=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts | head -1)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "本次构建版本：$V"

      # CI 测试版通道：分支构建成功后自动发布/覆盖一个 pre-release（tag: ci-latest）。
      # App 里打开「测试版通道」就能检测到它，不用手动打正式标签。
      - name: 发布/刷新 CI 测试版（分支构建）
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-latest
          # 标题里必须带版本号：App 靠它判断新旧（GitHub 替换资产时 published_at 不变，
          # 只按时间比较会永远显示"已是最新"）
          name: CI 测试版 v${{ steps.ver.outputs.version }}（自动覆盖）
          files: |
            app/build/outputs/apk/edu/release/*.apk
            app/build/outputs/apk/general/release/*.apk
          body: |
            CI 测试版 v${{ steps.ver.outputs.version }}（每次构建自动覆盖，不稳定，仅供尝鲜/内测）。
            稳定版请看正式 Release（标题里带「正式版」的那些）。

            安装包说明（功能相同，只有答题内容不同）：
            学段版：内置题库，按年级+学科出题，高中按选科筛选
            通用版：不含题库，出繁琐计算题
          prerelease: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
