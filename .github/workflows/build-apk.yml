name: Build APK

# 触发条件：
# 1. 推送到 main 分支
# 2. 手动触发（Actions 页面点 "Run workflow"）
# 发布 Release 需要写权限（GitHub 默认令牌权限已收紧为只读，必须显式声明）
permissions:
  contents: write

on:
  push:
    branches: [main, 'fix/**', 'feat/**']
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v3

      # 本机生成的 gradle-wrapper.properties 指向腾讯镜像（国内快），
      # 但 GitHub 服务器在海外，官方源更稳，这里换回去（版本号用通配，升级 wrapper 无需改这里）
      - name: 修正 Gradle 下载源
        run: |
          sed -i 's|https\\://mirrors.tencent.com/gradle/gradle-.*-bin.zip|https\\://services.gradle.org/distributions/gradle-8.11.1-bin.zip|' gradle/wrapper/gradle-wrapper.properties
          grep distributionUrl gradle/wrapper/gradle-wrapper.properties

      # local.properties 里的 sdk.dir 是开发机路径，CI 环境不需要它
      #（ANDROID_HOME 由 AGP 自动探测），直接移除避免干扰
      - name: 清理本机路径配置
        run: rm -f local.properties

      # 稳定签名密钥只保存在 GitHub Actions Secrets，不进入公开仓库。
      # 所有构建使用同一证书，支持后续 APK 覆盖安装升级。
      - name: 恢复稳定签名密钥
        env:
          FOCUSGUARD_KEYSTORE_BASE64: ${{ secrets.FOCUSGUARD_KEYSTORE_BASE64 }}
          FOCUSGUARD_STORE_PASSWORD: ${{ secrets.FOCUSGUARD_STORE_PASSWORD }}
          FOCUSGUARD_KEY_ALIAS: ${{ secrets.FOCUSGUARD_KEY_ALIAS }}
          FOCUSGUARD_KEY_PASSWORD: ${{ secrets.FOCUSGUARD_KEY_PASSWORD }}
        run: |
          test -n "$FOCUSGUARD_KEYSTORE_BASE64"
          mkdir -p keystore
          printf '%s' "$FOCUSGUARD_KEYSTORE_BASE64" | base64 --decode > keystore/focusguard-release.p12
          chmod 600 keystore/focusguard-release.p12
          printf 'FOCUSGUARD_STORE_PASSWORD=%s\n' "$FOCUSGUARD_STORE_PASSWORD" >> "$GITHUB_ENV"
          printf 'FOCUSGUARD_KEY_ALIAS=%s\n' "$FOCUSGUARD_KEY_ALIAS" >> "$GITHUB_ENV"
          printf 'FOCUSGUARD_KEY_PASSWORD=%s\n' "$FOCUSGUARD_KEY_PASSWORD" >> "$GITHUB_ENV"

      # 拆分 flavor 后 testDebugUnitTest 有歧义，需明确指定两个变体
      - name: 单元测试
        run: ./gradlew testEduDebugUnitTest testGeneralDebugUnitTest --no-daemon

      - name: 上传测试报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          retention-days: 7

      - name: 构建 Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: 上传 APK 产物（学段版 / 通用版）
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apks
          path: |
            app/build/outputs/apk/edu/debug/*.apk
            app/build/outputs/apk/general/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # 仅在 main 分支推送且打标签时自动创建 / 更新 GitHub Release
      - name: 发布 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/edu/debug/*.apk
            app/build/outputs/apk/general/debug/*.apk
          name: ${{ github.ref_name }} - 正式版
          # 更新说明手写、说人话（不用提交信息自动生成，太技术化）
          body: |
            修复了 打开被锁应用要等几秒才挡住的问题
            修复了 封锁页盖在桌面上、偶发误弹一次的问题
            修复了 答题时选择题只显示 A/B/C/D、看不到选项文字的问题
            修复了 杀后台后守护不自愈的问题
            修复了 冻结的应用到时间解不开的问题
            修复了 重启后录制权限显示已授权、实际没生效的问题
            新增了 锁住应用的悬浮窗遮盖：打开即挡，不再把人弹出应用
            新增了 锁住应用时冻结/停止该应用（小窗、分屏、后台声音一起停）
            新增了 防破解开关：不在最近任务里显示、禁止安装应用、禁止改时间、禁止 USB 传文件等
            新增了 AI 对话可直接锁住/解冻应用（解冻需先答题）
            优化了 设置页：不常用分组收起来，展开收起有动画
            优化了 通知：提醒会自己消失，不再两条叠在一起
            优化了 AI 对话：模型乱执行没被要求的操作会被忽略

          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
