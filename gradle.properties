org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# ── aarch64 (Termux / proot) 构建专用 ──────────────────────────────
# Google 官方只发布 x86_64 版 aapt2。在 aarch64 上构建需要
# 通过 qemu-user 转译，取消下面两行注释并指向本地包装器。
# 在 x86_64 Linux / macOS 上构建请保持注释状态。
#android.aapt2FromMavenOverride=/root/android-sdk/build-tools/34.0.0/aapt2-aarch64
#org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:-UseContainerSupport
